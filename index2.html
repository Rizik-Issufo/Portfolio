<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload de Ficheiros Grandes</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="p-5">
    <div class="container text-center">
      <h2>Carregamento de Ficheiros Grandes</h2>
      <form id="uploadForm" class="mt-4">
        <input
          type="file"
          name="file"
          id="fileInput"
          class="form-control"
          required
        />
        <button type="submit" class="btn btn-primary mt-3">Enviar</button>
      </form>

      <div class="progress mt-4" style="height: 25px">
        <div
          id="progressBar"
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          style="width: 0%"
        >
          0%
        </div>
      </div>

      <div id="status" class="mt-3"></div>
    </div>

    <script>
      const form = document.getElementById("uploadForm");
      const progressBar = document.getElementById("progressBar");
      const status = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const file = document.getElementById("fileInput").files[0];
        if (!file) return alert("Selecione um ficheiro.");

        const formData = new FormData();
        formData.append("file", file);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "http://localhost:8080/dedup");

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = percent + "%";
            progressBar.textContent = percent + "%";
          }
        });

        xhr.onload = () => {
          if (xhr.status === 200) {
            status.innerHTML =
              '<div class="alert alert-success">Upload concluído com sucesso!</div>';
          } else {
            status.innerHTML =
              '<div class="alert alert-danger">Erro no upload!</div>';
          }
        };

        xhr.send(formData);
      });
    </script>
  </body>
</html>
